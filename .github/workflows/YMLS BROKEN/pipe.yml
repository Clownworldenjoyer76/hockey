name: NHL Pipeline Simplified

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-pipeline
  cancel-in-progress: false

jobs:
  nhl-pipeline:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      # ==========================================
      # ENVIRONMENT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set date
        run: echo "DATE=$(TZ='America/New_York' date +%Y_%m_%d)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/hockey/nhl/requirements.txt

      - name: Cache Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('docs/win/hockey/nhl/requirements.txt') }}

      - name: Cache SDV xG models
        uses: actions/cache@v5
        with:
          path: ~/.cache/nhl_xg_models
          key: sdv-nhl-xg-models-v1

      - name: Cache SDV season datasets
        uses: actions/cache@v5
        with:
          path: ~/.cache/nhl_sdv_season_v2
          key: nhl-sdv-season-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhl-sdv-season-v2-

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # ==========================================
      # VALIDATION
      # ==========================================

      - name: Validate pipeline
        run: python docs/win/hockey/nhl/scripts/tests/validate_pipeline.py

      - name: Run pipeline tests
        run: |
          python -m pytest \
            docs/win/hockey/nhl/scripts/tests/test_nhl_pipeline.py \
            docs/win/hockey/nhl/scripts/tests/test_secondary_model_signals.py -v

      - name: Test game ID reconciliation
        run: python docs/win/hockey/nhl/scripts/tests/test_game_id_reconciliation.py

      # ==========================================
      # 00 INTAKE
      # ==========================================

      - name: 00 - Pull NHL schedule
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_schedule.py

      - name: 00 - Detect current slate
        id: slate
        run: |
          schedule="docs/win/hockey/nhl/00_intake/nhl_schedule/NHL_${DATE}.csv"
          test -f "$schedule"
          games=$(awk -F',' 'NR > 1 && ($13 == "2" || $13 == "3") {n++} END {print n+0}' "$schedule")
          if [ "$games" -gt 0 ]; then
            echo "has_games=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_games=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 00 - Scrape D-Ratings
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/hockey_drat_scraper.py

      - name: 00 - Transform predictions
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/transform_hockey.py

      - name: 00 - Normalize prediction names
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/pred_name_normalization.py

      - name: 00 - Pull odds
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/nhl_odds_pull.py

      - name: 00 - Transform odds
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/transform_hockey_odds.py

      - name: 00 - Normalize odds names
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/odds_name_normalization.py

      - name: 00 - Reconcile game IDs
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/reconcile_game_ids.py

      - name: 00 - Build games
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/build_games.py

      - name: 00 - Pull SDV
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py

      # ==========================================
      # 01 MERGE
      # ==========================================

      - name: 01 - Restore SDV history
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/01_merge/restore_nhl_sdv_history.py prepare

      - name: 01 - Merge intake
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/01_merge/merge_intake.py

      - name: 01 - Audit SDV coverage
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/01_merge/restore_nhl_sdv_history.py audit

      - name: 01 - Build juice files
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/01_merge/build_juice_files.py

      # ==========================================
      # 02 JUICE
      # ==========================================

      - name: 02 - Validate calibration
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/02_juice/validate_juice_config.py

      - name: 02 - Moneyline juice
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/02_juice/apply_moneyline_juice.py

      - name: 02 - Puck line juice
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/02_juice/apply_puck_line_juice.py

      - name: 02 - Total juice
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/02_juice/apply_total_juice.py

      # ==========================================
      # 03 EDGES
      # ==========================================

      - name: 03 - Compute edges
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/03_edges/compute_edges.py

      - name: 03 - Compute EV and Kelly
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/03_edges/compute_ev_kelly.py

      - name: 03 - Secondary model signals
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/03_edges/build_secondary_model_signals.py

      - name: 03 - Independent probabilities
        if: steps.slate.outputs.has_games == 'true'
        env:
          NHL_ALLOW_INDEPENDENT_COMPARE: "1"
        run: |
          python -m pip install scikit-learn==1.8.0
          python docs/win/hockey/nhl/scripts/01_merge/test_repo_independent_compare.py --date "$DATE"

      - name: Upload independent comparison
        if: steps.slate.outputs.has_games == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nhl-independent-comparison-${{ env.DATE }}
          path: |
            docs/win/hockey/nhl/my_probability/test_repo_side_by_side/predictions/${{ env.DATE }}_NHL_independent.csv
            docs/win/hockey/nhl/my_probability/test_repo_side_by_side/comparisons/${{ env.DATE }}_NHL_three_market_side_by_side.csv
            docs/win/hockey/nhl/my_probability/test_repo_side_by_side/manifests/${{ env.DATE }}.json
          if-no-files-found: error

      # ==========================================
      # 04 SELECTION
      # ==========================================

      - name: 04 - Validate markets
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/04_select/validate_markets_config.py

      - name: 04 - Select bets
        if: steps.slate.outputs.has_games == 'true'
        run: python docs/win/hockey/nhl/scripts/04_select/hockey_select_bets.py

      # ==========================================
      # 05 GRADING AND REPORTING
      # ==========================================

      - name: Detect grading inputs
        id: grading
        run: |
          if find docs/win/hockey/nhl/04_select -maxdepth 1 -type f -name '*_NHL.csv' -print -quit | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 05 - Transform final scores
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/transform_final_scores.py

      - name: 05 - Grade results
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/01_nhl_results_grade.py

      - name: 05 - Analyze results
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/02_nhl_results_analyze.py

      - name: 05 - Build reports
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/03_nhl_results_reports.py

      - name: 05 - Calculate CLV
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/04_nhl_clv.py

      - name: 05 - Build dashboard
        if: steps.grading.outputs.ready == 'true'
        run: python docs/win/hockey/nhl/scripts/05_final_scores/05_nhl_results_dashboard.py

      # ==========================================
      # LOGS AND HEALTH
      # ==========================================

      - name: Print error logs
        if: failure()
        run: |
          find docs/win/hockey/nhl/errors \
            docs/win/hockey/nhl/05_final_scores/errors \
            -type f -name "*.txt" \
            -print -exec cat {} \; || true

      - name: Pipeline health
        if: always()
        env:
          NHL_PIPELINE_JOB_STATUS: ${{ job.status }}
          NHL_PIPELINE_RUN_DATE: ${{ env.DATE }}
        run: python docs/win/hockey/nhl/scripts/pipeline_health.py

      # ==========================================
      # SAVE OUTPUTS
      # ==========================================

      - name: Commit pipeline outputs
        if: success()
        run: |
          git add -A docs/win/hockey/nhl/odds
          git add -A docs/win/hockey/nhl/00_intake
          git add -A docs/win/hockey/nhl/sdv
          git add -A docs/win/hockey/nhl/01_merge
          git add -A docs/win/hockey/nhl/02_juice
          git add -A docs/win/hockey/nhl/03_edges
          git add -A docs/win/hockey/nhl/04_select
          git add -A docs/win/hockey/nhl/05_final_scores
          git add -A docs/win/hockey/nhl/errors
          git add -A docs/win/hockey/nhl/config/mapping
          git add -A docs/win/hockey/nhl/test_output/game_id_reconciliation
          git add -A docs/win/hockey/nhl/pipeline_health.json
          git add -A frontend/data/dashboards/nhl.json
          git add -A frontend/data/pipeline_health/nhl.json

          if git diff --cached --quiet; then
            echo "No pipeline output changes."
          else
            git commit -m "chore: NHL pipeline ${DATE}"
            git pull --rebase origin main
            git push
          fi
