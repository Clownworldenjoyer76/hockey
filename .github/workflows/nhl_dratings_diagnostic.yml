name: NHL DRatings Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Inspect DRatings from GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Test DRatings webpage
        run: python docs/win/hockey/nhl/scripts/00_intake/drat_actions_diagnostic.py

      - name: Upload diagnostic evidence even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dratings-browser-evidence
          path: drat_diagnostic_output/
          if-no-files-found: warn
          retention-days: 7
