name: NHL Lineups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-lineups-and-goalies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull NHL Line Combinations
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_line_combinations.py

      - name: Pull NHL Starting Goalies
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_starting_goalies.py

      - name: Commit CSVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/win/hockey/nhl/00_intake/lineups/
          git diff --cached --quiet || git commit -m 'Update NHL line combinations and starting goalies CSVs'
          git push
