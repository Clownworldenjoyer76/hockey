name: NHL Odds Fix Tests

on:
  pull_request:
    paths:
      - "docs/win/hockey/nhl/scripts/**"
      - ".github/workflows/nhl_odds_fix_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nhl-pr-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r docs/win/hockey/nhl/requirements.txt
          python -m pip install pytest
      - name: Compile patched pipeline modules
        run: |
          python -m compileall -q docs/win/hockey/nhl/scripts
      - name: Run NHL pipeline regression tests
        run: |
          python -m pytest -q docs/win/hockey/nhl/scripts/tests/test_nhl_pipeline.py docs/win/hockey/nhl/scripts/tests/test_secondary_model_signals.py
