
name: NHL Player Strength

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  player-strength:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r docs/win/hockey/nhl/requirements.txt

      - name: Calculate player strength
        run: |
          python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_player_strength.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/win/hockey/nhl/sdv/lineup-strength/player_strength_snapshots
          git add -A docs/win/hockey/nhl/sdv/lineup-strength/latest_team_player_strength.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update NHL player strength"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
