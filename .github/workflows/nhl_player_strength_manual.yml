name: NHL SDV MANUAL PULL

# No cron schedule. External cron-job.org dispatches this workflow when wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize against the existing NHL 01 Pipeline. Do not modify the pipeline.
concurrency:
  group: nhl-pipeline
  cancel-in-progress: false

jobs:
  player-strength:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install NHL requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/hockey/nhl/requirements.txt

      - name: Restore SportsDataverse season cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/nhl_sdv_season_v2
          key: nhl-sdv-season-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nhl-sdv-season-v2-

      - name: Calculate historical player strength
        run: python docs/win/hockey/nhl/scripts/00_intake/pull_nhl_player_strength.py

      - name: Commit snapshot for the normal pipeline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/win/hockey/nhl/sdv/lineup-strength/player_strength_snapshots
          git add -A -- docs/win/hockey/nhl/sdv/lineup-strength/latest_team_player_strength.csv
          if git diff --cached --quiet; then
            echo "No changes in player-strength snapshots"
          else
            git commit -m "data: refresh historical NHL player strength"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
