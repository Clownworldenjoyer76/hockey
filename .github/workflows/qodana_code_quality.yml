name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python-community
            --within-docker false
            --clear-cache
          use-caches: false
          upload-result: true
          artifact-name: qodana-clean-project-model
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_960613749 }}
          QODANA_ENDPOINT: "https://qodana.cloud"
          QODANA_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
