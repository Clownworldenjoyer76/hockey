markets:
  nhl:
  # SEE BOTTOM OF FILE FOR DETAILS.
    secondary_model:
      enabled: true
      selection_mode: high_disagreement_requires_secondary_support
      unavailable_behavior: use_primary
      min_train_rows: 100
      disagreement_quantile: 0.75
      derived_signal_by_market:
        moneyline: weighted
        puck_line: meta
        total: meta
##########################################################################################################################################################       
##########################################################################################################################################################
# ── Moneyline ────────────────────────────────────#######################################################################################################
##########################################################################################################################################################       
    moneyline:
      enabled: true
      pick_preference: best_prob
      home:
        enabled: true
        my_model_prob_bands:
          - [0.50, 1.00]
        prob_bands:
          - [0.00, 1.00]
        odds_bands:
          - [-500, 500]
        ev_bands:
          - [0.00, 999.9999]
        kelly_bands:
          - [0.0, 999.9999]

      away:
        enabled: true
        my_model_prob_bands:
          - [0.45, 1.00]
        prob_bands:
          - [0.45, 1.00]
        odds_bands:
          - [-500, 500]
        ev_bands:
          - [0.00, 999.9999]
        kelly_bands:
          - [0.0, 999.9999]
##########################################################################################################################################################       
##########################################################################################################################################################
# ── PUCK LINE  ────────────────────────────────────######################################################################################################
##########################################################################################################################################################
    puck_line:
      enabled: true
      pick_preference: best_my_model_prob
      home:
        enabled: true
        prob_bands:
          - [0.70, 1.0]
        line_bands:
          - [-5.0, 5.0]
        my_model_prob_bands:
          - [0.60, 1.0]
        odds_bands:
          - [-500, -200]
        ev_bands:
          - [0.00, 100.0]
        kelly_bands:
          - [0.0, 999.9999]

      away:
        enabled: true
        prob_bands:
          - [0.70, 1.0]
        line_bands:
          - [-5.0, 5.0]
        my_model_prob_bands:
          - [0.60, 1.0]
        odds_bands:
          - [-999, -150]
          - [-109, 100]
        ev_bands:
          - [0.00, 100.0]
        kelly_bands:
          - [0.0, 999.9999]
##########################################################################################################################################################       
##########################################################################################################################################################
# ── TOTAL      ────────────────────────────────────######################################################################################################
##########################################################################################################################################################
    total:
      enabled: true
      pick_preference: best_prob

      over:
        enabled: true
        prob_bands:
          - [0.60, 1.00]
        line_bands:
          - [0.0, 100.0]
        my_model_prob_bands:
          - [0.0, 1.0]
        odds_bands:
          - [-500, 500]
        ev_bands:
          - [0.00, 999.9999]
        kelly_bands:
          - [0.0, 999.9999]

      under:
        enabled: true
        prob_bands:
          - [0.55, 1.00]
        line_bands:
          - [0.0, 100.0]
        my_model_prob_bands:
          - [0.0, 1.0]
        odds_bands:
          - [-500, 500]
        ev_bands:
          - [0.00, 999.9999]
        kelly_bands:
          - [0.0, 999.9999]

          
