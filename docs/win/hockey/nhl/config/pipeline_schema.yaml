pipeline:
  name: nhl
  schema_version: 13
  schema_created_at: '2026-08-29'
  schema_updated_at: '2026-08-31'
  timezone: America/New_York
stage_schemas:
  00_intake:
    version: 7
    path: docs/win/hockey/nhl/00_intake
  01_merge:
    version: 9
    path: docs/win/hockey/nhl/01_merge
  02_juice:
    version: 5
    path: docs/win/hockey/nhl/02_juice
  03_edges:
    version: 2
    path: docs/win/hockey/nhl/03_edges
  04_select:
    version: 3
    path: docs/win/hockey/nhl/04_select
  05_final_scores:
    version: 4
    path: docs/win/hockey/nhl/05_final_scores
canonical_game_identity:
  field: game_id
  definition: Official NHL game identifier
  source: NHL API
  source_endpoint: https://api-web.nhle.com/v1/schedule/{date}
  source_field: game.id
  authoritative_path: docs/win/hockey/nhl/00_intake/nhl_schedule
  reconciliation_script: docs/win/hockey/nhl/scripts/00_intake/reconcile_game_ids.py
  rules:
  - game_id is assigned from the official NHL schedule.
  - game_id is not a sportsbook or ESPN event identifier.
  - game_id remains the canonical identifier across downstream NHL stages.
team_identity:
  mapping_file: docs/win/hockey/nhl/config/mapping/team_map_nhl.csv
  canonical_fields:
  - canonical_team
  - nhl_team_id
  - nhl_abbrev
  supported_sources:
  - official_nhl
  - dratings
  - sportsbook
  - shared
  - final_scores
sportsbook:
  odds_source: ESPN
  acquisition_library: SportsDataverse
  acquisition_script: docs/win/hockey/nhl/scripts/00_intake/nhl_odds_pull.py
  transform_script: docs/win/hockey/nhl/scripts/00_intake/transform_hockey_odds.py
  acquisition_functions:
    scoreboard: sportsdataverse.nhl.espn_nhl_scoreboard
    odds: sportsdataverse.nhl.espn_nhl_game_odds
  source_endpoints:
    scoreboard: https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard
    odds: https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl/events/{event_id}/competitions/{competition_id}/odds
  provider_selection:
    mode: priority_fallback_per_market
    priority:
    - Titanbets
    - MGM
    - Bet365
    - Caesars Sportsbook
    - SugarHouse
    fallback: Other available non-live ESPN providers ordered after the preferred provider groups.
    exclude_provider_name_contains:
    - Live Odds
    markets:
    - moneyline
    - puck_line
    - total
    rule: Provider selection is performed independently for each market.
  normalized_output:
    path: docs/win/hockey/nhl/00_intake/sportsbook
    semantics:
    - One sportsbook row is produced per ESPN event after market-level provider selection.
    - Moneyline, puck line, and total may come from different providers when fallback is required.
    - Provider provenance is retained separately for each market.
  fields:
    sportsbook_event_id:
      definition: ESPN event identifier associated with the sportsbook odds event.
      canonical_game_id: false
      purpose: Provider-specific event identifier used before reconciliation to the official NHL game_id.
    provider_id:
      definition: ESPN sportsbook provider identifier.
      canonical_game_id: false
      purpose: Identifies the sportsbook supplying a market.
    provider_name:
      definition: ESPN sportsbook provider name.
      canonical_game_id: false
      purpose: Identifies the sportsbook supplying a market.
    game_id:
      definition: Official NHL game identifier assigned during reconciliation.
      canonical_game_id: true
  provider_provenance_fields:
    moneyline:
      provider_id: moneyline_provider_id
      provider_name: moneyline_provider_name
    puck_line:
      provider_id: puck_line_provider_id
      provider_name: puck_line_provider_name
    total:
      provider_id: total_provider_id
      provider_name: total_provider_name
  latest_snapshot:
    path: docs/win/hockey/nhl/odds/<YYYY_MM_DD>.json
    behavior: Latest ESPN odds state for the run date; repeated runs may replace this file.
  immutable_snapshots:
    path: docs/win/hockey/nhl/odds/snapshots/<YYYY_MM_DD>/<timestamp>.json
    behavior: Each ESPN odds pull is retained separately for line-movement and closing-line analysis.
  provenance:
    generated_at_field: generated_at_et
    transformed_pull_time_field: pulled_at
    source_field: source
    transformed_source_field: odds_source
    timezone: America/New_York
    rules:
    - ESPN event identifiers remain separate from official NHL game_id.
    - ESPN sportsbook provider identifiers remain separate from official NHL game_id.
    - Provider used for each market is retained in the transformed sportsbook output.
  provider_provenance_propagation:
    stage_01_merge:
      path: docs/win/hockey/nhl/01_merge
      fields:
      - odds_source
      - moneyline_provider_id
      - moneyline_provider_name
      - puck_line_provider_id
      - puck_line_provider_name
      - total_provider_id
      - total_provider_name
      - pulled_at
      rule: The merged game row preserves the selected provider identity for every market plus source and pull timestamp.
    stage_01_market_files:
      moneyline_fields:
      - odds_source
      - moneyline_provider_id
      - moneyline_provider_name
      - pulled_at
      puck_line_fields:
      - odds_source
      - puck_line_provider_id
      - puck_line_provider_name
      - pulled_at
      total_fields:
      - odds_source
      - total_provider_id
      - total_provider_name
      - pulled_at
      rule: Each market file retains only the provider identity relevant to that market, together with source and pull timestamp.
    stage_02_juice:
      path: docs/win/hockey/nhl/02_juice
      moneyline_fields:
      - odds_source
      - moneyline_provider_id
      - moneyline_provider_name
      - pulled_at
      puck_line_fields:
      - odds_source
      - puck_line_provider_id
      - puck_line_provider_name
      - pulled_at
      total_fields:
      - odds_source
      - total_provider_id
      - total_provider_name
      - pulled_at
      rule: Juice/calibration processing must preserve market-specific provider provenance unchanged.
    stage_03_edges:
      path: docs/win/hockey/nhl/03_edges
      rule: Stage 03 preserves incoming provider provenance as pass-through dataframe columns while calculating edge, EV,
        and Kelly values.
    stage_04_select:
      path: docs/win/hockey/nhl/04_select
      output_fields:
      - selected_provider_id
      - selected_provider_name
      - odds_source
      - pulled_at
      mapping:
        moneyline: moneyline_provider_id / moneyline_provider_name
        puck_line: puck_line_provider_id / puck_line_provider_name
        total: total_provider_id / total_provider_name
      rule: Every selected wager records the provider whose selected market price generated the wager's edge and EV.
    stage_05_final_scores:
      path: docs/win/hockey/nhl/05_final_scores
      required_selected_bet_fields:
      - selected_provider_id
      - selected_provider_name
      - odds_source
      - pulled_at
      - secondary_model_status
      - secondary_signal_version
      - secondary_challenger_support
      - secondary_derived_model
      - secondary_derived_support
      - secondary_decision
      rule: Graded outputs preserve sportsbook/provider provenance and the complete secondary-model selection audit fields unchanged.
prediction_model:
  primary_source:
    name: D-Ratings
    source_url: https://www.dratings.com/predictor/nhl-hockey-predictions/
    scraper: docs/win/hockey/nhl/scripts/00_intake/hockey_drat_scraper.py
    output_root: docs/win/hockey/nhl/00_intake/predictions
  supplemental_source:
    name: SportsDataverse
    script: docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py
    output_root: docs/win/hockey/nhl/sdv
    categories:
    - schedule
    - team-strength
    - goalie
    - lineup-strength
    - fatigue
    - sdv_predictions
    - odds
  secondary_prediction_integration:
    status: VERIFIED_PRODUCTION_ARCHITECTURE
    primary_model: D-Ratings
    primary_rule: D-Ratings remains the sole source for Stage 02 fair/model probability construction and primary edge/EV/Kelly calculations.
    sdv_current_file: docs/win/hockey/nhl/sdv/sdv_predictions/latest_predictions.csv
    sdv_producer: docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py
    merge_script: docs/win/hockey/nhl/scripts/01_merge/merge_intake.py
    join_identity:
    - game_id
    merged_fields:
    - sdv_home_win_prob
    - sdv_exp_margin
    - sdv_exp_total
    missing_sdv_behavior: Leave SDV prediction fields blank and continue with the D-Ratings primary path.
    signal_builder: docs/win/hockey/nhl/scripts/03_edges/build_secondary_model_signals.py
    signal_input_root: docs/win/hockey/nhl/03_edges/ev_kelly
    signal_output_root: docs/win/hockey/nhl/03_edges/secondary_signals
    historical_training_source: docs/win/hockey/nhl/research/sdv_challenger/season_*/standalone_comparison.csv
    historical_training_retention: This file is a required production calibration input after this deployment. Do not delete it unless a versioned compact calibration artifact replaces it and the signal builder/schema are updated together.
    training_contract:
      completed_rows_only: true
      target_rule: historical game_date must be strictly earlier than target game_date.
      minimum_prior_rows: 100
      disagreement_quantile: 0.75
      same_day_rows: excluded
    raw_disagreement_fields:
    - prob_disagreement
    - margin_disagreement
    - total_disagreement
    learned_threshold_fields:
    - prob_disagreement_threshold_p75_prior
    - margin_disagreement_threshold_p75_prior
    - total_disagreement_threshold_p75_prior
    high_disagreement_fields:
    - high_prob_disagreement_flag
    - high_margin_disagreement_flag
    - high_total_disagreement_flag
    calibrated_weighted_fields:
    - weighted_prob_drat_weight
    - weighted_margin_drat_weight
    - weighted_total_drat_weight
    - weighted_home_win_prob
    - weighted_exp_margin
    - weighted_exp_total
    meta_model_fields:
    - meta_home_win_prob
    - meta_exp_margin
    - meta_exp_total
    derived_signal_by_market:
      moneyline: weighted
      puck_line: meta
      total: meta
    selection_script: docs/win/hockey/nhl/scripts/04_select/hockey_select_bets.py
    selection_rule: A bet must first pass the existing D-Ratings primary rules. When historical disagreement is high, retain it only if the SDV challenger or the configured calibrated derived signal supports that bet side.
    unavailable_behavior: If SDV or calibrated-history output is unavailable, preserve the D-Ratings primary decision and record an explicit fallback status.
    selected_bet_audit_fields:
    - secondary_model_status
    - secondary_signal_version
    - secondary_challenger_support
    - secondary_derived_model
    - secondary_derived_support
    - secondary_decision
    research_reference: docs/win/hockey/nhl/scripts/research/build_sdv_challenger.py
    research_deployment_role: secondary_confirmation_and_calibrated_signal
    sole_model_replacement: false
  fatigue_integration:
    source_root: docs/win/hockey/nhl/sdv/fatigue
    merge_script: docs/win/hockey/nhl/scripts/01_merge/merge_intake.py
    join_identity:
    - game_date
    - canonical_team
    source_fields:
    - days_rest
    - back_to_back
    - games_in_4_days
    - three_in_four
    - games_in_6_days
    - four_in_six
    - games_in_7_days
    game_level_fields:
    - home_days_rest
    - away_days_rest
    - home_back_to_back
    - away_back_to_back
    - home_games_in_4_days
    - away_games_in_4_days
    - home_three_in_four
    - away_three_in_four
    - home_games_in_6_days
    - away_games_in_6_days
    - home_four_in_six
    - away_four_in_six
    - home_games_in_7_days
    - away_games_in_7_days
    - rest_differential
    rest_differential_definition: home_days_rest - away_days_rest
    boolean_encoding: 1=true, 0=false
    missing_behavior: Leave fatigue features blank when no matching SportsDataverse fatigue row is available; do not synthesize
      values.
  team_strength_integration:
    source_root: docs/win/hockey/nhl/sdv/team-strength
    source_label: team_ratings_asof
    current_file: docs/win/hockey/nhl/sdv/team-strength/latest_team_ratings_asof.csv
    historical_file_pattern: docs/win/hockey/nhl/sdv/team-strength/season_<season>_team_ratings_asof.csv
    producer_script: docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py
    merge_script: docs/win/hockey/nhl/scripts/01_merge/merge_intake.py
    join_identity:
    - game_id
    - canonical_team
    timestamp_fields:
      pregame_cutoff_utc:
        definition: Strict upper bound for information allowed in the reconstructed team-strength snapshot.
        comparison: ratings_as_of_utc < pregame_cutoff_utc
      ratings_as_of_utc:
        definition: Timestamp of the current snapshot or reconstructed historical as-of instant.
      pregame_cutoff_source:
        definition: Provenance for the cutoff timestamp; official NHL schedule is preferred and conservative game-date start
          is used only as a safe fallback.
    source_fields:
    - adj_xgf
    - adj_xga
    - adj_xg_net
    - adj_gf
    - adj_ga
    - off_rank
    - def_rank
    - net_rank
    - net_z
    game_level_fields:
    - home_adj_xgf
    - away_adj_xgf
    - adj_xgf_differential
    - home_adj_xga
    - away_adj_xga
    - adj_xga_differential
    - home_adj_xg_net
    - away_adj_xg_net
    - adj_xg_net_differential
    - home_adj_gf
    - away_adj_gf
    - adj_gf_differential
    - home_adj_ga
    - away_adj_ga
    - adj_ga_differential
    - home_off_rank
    - away_off_rank
    - off_rank_differential
    - home_def_rank
    - away_def_rank
    - def_rank_differential
    - home_net_rank
    - away_net_rank
    - net_rank_differential
    - home_net_z
    - away_net_z
    - net_z_differential
    differential_definition: home value - away value for each source field
    as_of_rules:
      strict_comparison: ratings_as_of_utc must be strictly less than pregame_cutoff_utc.
      current: Create a team-strength row only when the snapshot generation timestamp is strictly before that game's pregame
        cutoff. Rows generated at or after the cutoff are not eligible.
      historical: Reconstruct each game's ratings only from SportsDataverse team game rates with source game date strictly
        earlier than the target game date, then stamp the reconstructed snapshot strictly before that game's pregame cutoff.
      canonical_validation: Stage 01 derives the canonical game cutoff from game_date + game_time in America/New_York and
        rejects any stored pregame_cutoff_utc later than the canonical game start.
      forbidden: Do not use the target game, any later game, a full-season rating, a postgame rating, or any team-strength
        row where ratings_as_of_utc is at or after pregame_cutoff_utc.
    propagation:
    - 01_merge merged output
    - 01_merge/01_merguiced moneyline output
    - 01_merge/01_merguiced puck-line output
    - 01_merge/01_merguiced total output
    - 02_juice moneyline output
    - 02_juice puck-line output
    - 02_juice total output
    missing_behavior: Leave team-strength features and their differentials blank when no as-of-safe team-strength row is available;
      do not synthesize values.
  goalie_integration:
    source_root: docs/win/hockey/nhl/sdv/goalie
    source_label: game_goalie_features_asof
    current_file: docs/win/hockey/nhl/sdv/goalie/latest_game_goalie_features_asof.csv
    historical_file_pattern: docs/win/hockey/nhl/sdv/goalie/season_<season>_game_goalie_features_asof.csv
    producer_script: docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py
    merge_script: docs/win/hockey/nhl/scripts/01_merge/merge_intake.py
    join_identity:
    - game_id
    source_metric:
      function: sportsdataverse.nhl.nhl_goalie_gsax
      value_field: gsax
      identity_field: player_id
    game_level_fields:
    - home_expected_starter
    - away_expected_starter
    - home_starter_gsax
    - away_starter_gsax
    - home_backup_gsax
    - away_backup_gsax
    - starter_gsax_differential
    - home_goalie_status
    - away_goalie_status
    - home_goalie_status_observed_at
    - away_goalie_status_observed_at
    - home_goalie_status_source
    - away_goalie_status_source
    status_values:
    - projected
    - expected
    - confirmed
    - unknown
    current_status_behavior:
    - The built-in SportsDataverse producer emits projected when prior goalie usage can identify a candidate and unknown otherwise.
    - The built-in producer does not fabricate expected or confirmed status.
    - Expected or confirmed may only be supplied by a separately validated timestamped pregame source.
    as_of_rules:
      gsax: Calculate GSAx only from games strictly earlier than the target game date. The target game and all later games
        are excluded.
      current: A current goalie snapshot is eligible only when goalie_snapshot_as_of_utc is at or before the fixed T-60 goalie_decision_cutoff_utc.
      historical: Historical goalie features are reconstructed only from prior-game play-by-play and evaluated at the fixed
        T-60 goalie_decision_cutoff_utc.
      status: Each goalie status must have an observation timestamp at or before goalie_decision_cutoff_utc.
      canonical_validation: Stage 01 requires the goalie decision cutoff to equal the canonical game start minus 60 minutes
        and rejects later goalie snapshots or observations.
    starter_projection:
      method: Prior-game goalie appearance count among goalies observed for the team; highest prior appearances is projected
        starter and second-highest is projected backup.
      status: projected
      purpose: Leakage-safe fallback only; not a confirmation feed.
    production_cutoff:
      status: VERIFIED
      minutes_before_puck_drop: 60
      field: goalie_decision_cutoff_utc
      source_field: goalie_decision_cutoff_source
      source_value: fixed_60_minutes_before_puck_drop
      intended_bet_time: 60 minutes before the canonical NHL game start.
      eligibility_rule: Goalie snapshots and goalie status observations are eligible only when their timestamp is at or before
        goalie_decision_cutoff_utc.
      current_rule: If the current SportsDataverse goalie snapshot is created after goalie_decision_cutoff_utc, no game-level
        goalie feature row is produced for that game.
      historical_rule: Historical goalie features are reconstructed from prior games only and evaluated as of goalie_decision_cutoff_utc;
        later expected or confirmed observations are never backfilled.
      canonical_validation: Stage 01 requires goalie_decision_cutoff_utc to equal canonical game start minus 60 minutes and
        rejects any later goalie snapshot or observation.
      leakage_rule: Later projected, expected, or confirmed observations must never be backfilled into historical pregame
        predictions.
    propagation:
    - 01_merge merged output
    - 01_merge/01_merguiced moneyline output
    - 01_merge/01_merguiced puck-line output
    - 01_merge/01_merguiced total output
    - 02_juice moneyline output
    - 02_juice puck-line output
    - 02_juice total output
    missing_behavior: Leave goalie names and GSAx blank and set goalie status to unknown when no strict-as-of goalie row is
      available; do not synthesize confirmed information.
lineup_player_strength_integration:
  source_root: docs/win/hockey/nhl/sdv/lineup-strength
  source_label: game_lineup_features_asof
  current_file: docs/win/hockey/nhl/sdv/lineup-strength/latest_game_lineup_features_asof.csv
  historical_file_pattern: docs/win/hockey/nhl/sdv/lineup-strength/season_<season>_game_lineup_features_asof.csv
  producer_script: docs/win/hockey/nhl/scripts/00_intake/pull_sdv.py
  merge_script: docs/win/hockey/nhl/scripts/01_merge/merge_intake.py
  join_identity:
  - game_id
  production_cutoff:
    status: VERIFIED
    minutes_before_puck_drop: 60
    field: lineup_decision_cutoff_utc
    source_field: lineup_decision_cutoff_source
    source_value: fixed_60_minutes_before_puck_drop
    eligibility_rule: All player/unit metrics and any observed lineup state must be available at or before T-60.
    historical_rule: Historical features use prior games only; target-date and later events are excluded, and later lineup
      observations are never backfilled.
  production_metrics:
    skater_rapm:
      function: sportsdataverse.nhl.nhl_skater_rapm
      aggregation: TOI-weighted mean xg_rapm by team from the prior-game player pool
    skater_war:
      function: sportsdataverse.nhl.nhl_skater_war
      aggregation: Sum WAR by team from the prior-game player pool
    special_teams:
      function: sportsdataverse.nhl.nhl_special_teams_value
      aggregation: Sum pp_value and pk_value by team
    forward_line_strength:
      function: sportsdataverse.nhl.nhl_unit_ratings
      unit_type: forward_line
      aggregation: TOI-weighted mean unit_value by team
    defense_pair_strength:
      function: sportsdataverse.nhl.nhl_unit_ratings
      unit_type: defense_pair
      aggregation: TOI-weighted mean unit_value by team
  game_level_fields:
  - home_skater_rapm
  - away_skater_rapm
  - skater_rapm_differential
  - home_skater_war
  - away_skater_war
  - skater_war_differential
  - home_pp_value
  - away_pp_value
  - pp_value_differential
  - home_pk_value
  - away_pk_value
  - pk_value_differential
  - home_forward_line_strength
  - away_forward_line_strength
  - forward_line_strength_differential
  - home_defense_pair_strength
  - away_defense_pair_strength
  - defense_pair_strength_differential
  - home_lineup_status
  - away_lineup_status
  - home_lineup_observed_at
  - away_lineup_observed_at
  - home_lineup_source
  - away_lineup_source
  lineup_information:
    status_values:
    - projected
    - expected
    - confirmed
    - unknown
    built_in_sdv_behavior: SportsDataverse prior-game player metrics do not establish a timestamped pregame lineup confirmation,
      so built-in rows use status=unknown and leave lineup_observed_at blank.
    missing_or_late_behavior: Use unknown/blank. Never infer historical availability from final game participation or backfill
      observations after T-60.
  as_of_rules:
    current: Current game-level lineup/player rows are emitted only if lineup_snapshot_as_of_utc is at or before T-60.
    historical: PBP and shifts are filtered to games strictly before the target game date before RAPM, WAR, special-teams,
      or unit metrics are calculated.
    canonical_validation: Stage 01 requires the stored game start to match the canonical game start and lineup_decision_cutoff_utc
      to equal canonical game start minus 60 minutes.
    forbidden: Target-game data, later-game data, postgame participation used as lineup evidence, or any lineup observation
      after T-60.
  feature_evaluation:
    status: VERIFIED
    output: docs/win/hockey/nhl/sdv/lineup-strength/latest_pregame_feature_evaluation.json
    production:
    - nhl_skater_rapm
    - nhl_skater_war
    - nhl_special_teams_value
    - nhl_unit_ratings
    covered_elsewhere:
    - nhl_xg
    - nhl_goalie_gsax
    evaluated_not_selected:
    - nhl_penalty_value
    - nhl_faceoff_value
    research_only:
    - nhl_expected_assists
    - nhl_zone_transitions
    research_only_not_production_safe:
    - nhl_edge_skating_value
    as_of_evaluation:
      nhl_edge_skating_value: 'Not production-safe for historical T-60 reconstruction: SportsDataverse requires caller-supplied
        season aggregate EDGE detail_frames, the live detail path is not implemented, and the aggregate has no historical
        observation timestamp.'
      nhl_expected_assists: Pregame as-of safe when called only with PBP from games strictly before the target date; kept
        research-only until incremental predictive value is demonstrated.
      nhl_zone_transitions: Pregame as-of safe when called only with PBP from games strictly before the target date; kept
        research-only because controlled-entry classification is a documented PBP heuristic unless ground-truth tags are supplied.
    selection_notes:
      penalty_and_faceoff: WAR already includes penalty and faceoff components; separate production features would duplicate
        signal.
      edge_skating: Evaluated and excluded from production because the current SportsDataverse input contract cannot reproduce
        the historical T-60 information state.
      expected_assists: Evaluated as leakage-safe on prior-game PBP; research-only pending demonstrated incremental predictive
        value.
      zone_transitions: Evaluated as leakage-safe on prior-game PBP; research-only because the controlled/dump label is heuristic
        without a ground-truth tag feed.
  propagation:
  - 01_merge merged output
  - 01_merge/01_merguiced moneyline output
  - 01_merge/01_merguiced puck-line output
  - 01_merge/01_merguiced total output
  - 02_juice moneyline output
  - 02_juice puck-line output
  - 02_juice total output
  missing_behavior: Leave unavailable numeric player/unit features blank; represent unavailable or late lineup information
    as unknown with no observation timestamp.
production_architecture_2026_27:
  status: VERIFIED_PRODUCTION_ARCHITECTURE
  primary_model:
    name: D-Ratings
    role: primary
    rule: D-Ratings remains the primary pricing, probability, edge, EV, and Kelly model.
  sdv_challenger:
    name: SportsDataverse challenger
    role: secondary_confirmation_and_disagreement
    rule: SDV is used to confirm or challenge the D-Ratings side and to measure model disagreement; it does not replace D-Ratings as the primary model.
  calibrated_secondary_signal:
    role: secondary_signal
    methods:
    - weighted ensemble
    - calibrated meta model
    rule: Calibrated weighted/meta outputs are secondary derived signals used by the Stage 04 disagreement gate, not sole production models.
  blind_averaging:
    status: REJECTED
    rule: Do not blindly average D-Ratings and SDV predictions. Use only the validated market-specific weighted/meta secondary signals.
  edge_data:
    status: NOT_PRODUCTION
    rule: NHL EDGE-derived features are not part of the 2026-27 production model.

p9_research_disposition:
  status: COMPLETE_NO_PRODUCTION_PROMOTION
  shot_microstats:
    status: REJECTED
    production: false
    conclusion: Shot microstats worsened all six tested model metrics and are not promoted to production.
  zone_transitions:
    status: NOT_PROMOTED
    production: false
    conclusion: Zone-transition features were not promoted from research to production.
  edge_aggregates:
    status: BLOCKED
    production: false
    conclusion: Historical pregame EDGE aggregate state cannot be reconstructed safely at the production T-60 information cutoff, so EDGE aggregates remain blocked.
  edge_features:
    status: NOT_PRODUCTION
    production: false
    conclusion: EDGE/microstat research produced no approved production change for 2026-27.
  production_change: none
  rule: Do not add P9 shot microstats, zone-transition features, or EDGE aggregates to production unless new leakage-safe research demonstrates incremental value and pipeline_schema.yaml is synchronized again.

calibration:
  version: 1
  versioning_rule: Increment this version whenever the authoritative calibration configuration changes.
  adjustment_field: model_calibration_adjustment
  authoritative_files:
    moneyline: docs/win/hockey/nhl/config/juice/nhl_moneyline_juice.csv
    puck_line: docs/win/hockey/nhl/config/juice/nhl_puck_line_juice.csv
    total: docs/win/hockey/nhl/config/juice/nhl_total_juice.csv
  validator: docs/win/hockey/nhl/scripts/02_juice/validate_juice_config.py
market_configuration:
  authoritative_file: docs/win/hockey/nhl/config/markets.yaml
  validator: docs/win/hockey/nhl/scripts/04_select/validate_markets_config.py
  secondary_model_path: markets.nhl.secondary_model
  secondary_selection_mode: high_disagreement_requires_secondary_support
  secondary_unavailable_behavior: use_primary
  secondary_min_train_rows: 100
  secondary_disagreement_quantile: 0.75
  derived_signal_by_market:
    moneyline: weighted
    puck_line: meta
    total: meta
provenance:
  timezone: America/New_York
  rules:
  - Preserve the original data source wherever known.
  - Preserve provider-specific identifiers separately from canonical NHL identifiers.
  - Preserve generated-at timestamps when the source script produces them.
  - Preserve source timestamps when supplied by the upstream provider.
  - Do not replace canonical NHL game identity with sportsbook, D-Ratings, ESPN, or SportsDataverse identifiers.
  official_nhl_schedule:
    source: NHL API
    output_root: docs/win/hockey/nhl/00_intake/nhl_schedule
    source_time_field: start_time_utc
    run_log: docs/win/hockey/nhl/errors/00_intake/pull_nhl_schedule.txt
  dratings:
    source: D-Ratings
    output_root: docs/win/hockey/nhl/00_intake/predictions
    source_time_field: date_time
    run_log: docs/win/hockey/nhl/errors/00_intake/hockey_drat_scraper.txt
  sportsbook:
    source: ESPN
    acquisition_library: SportsDataverse
    output_root: docs/win/hockey/nhl/odds
    transformed_output_root: docs/win/hockey/nhl/00_intake/sportsbook
    generated_at_field: generated_at_et
    transformed_pull_time_field: pulled_at
    provider_selection: Titanbets -> MGM -> Bet365 -> Caesars Sportsbook -> SugarHouse -> other non-live ESPN providers
    provider_fields:
    - moneyline_provider_id
    - moneyline_provider_name
    - puck_line_provider_id
    - puck_line_provider_name
    - total_provider_id
    - total_provider_name
    selected_bet_provider_fields:
    - selected_provider_id
    - selected_provider_name
    - odds_source
    - pulled_at
    downstream_rule: Market-specific provider identity is preserved through Stages 01-03; Stage 04 maps the selected market
      provider to selected_provider_id/selected_provider_name; Stage 05 preserves those fields for grading and CLV analysis.
    clv_script: docs/win/hockey/nhl/scripts/05_final_scores/04_nhl_clv.py
  sportsdataverse:
    source: SportsDataverse
    output_root: docs/win/hockey/nhl/sdv
    snapshot_timestamp: Encoded in timestamped current-mode output filenames
odds_history_clv:
  status: VERIFIED_CURRENT_PRODUCTION_SCOPE
  snapshot_source: ESPN via SportsDataverse
  snapshot_writer: docs/win/hockey/nhl/scripts/00_intake/nhl_odds_pull.py
  latest_snapshot: docs/win/hockey/nhl/odds/<YYYY_MM_DD>.json
  immutable_snapshot_pattern: docs/win/hockey/nhl/odds/snapshots/<YYYY_MM_DD>/<timestamp>.json
  source_identity_rule: Each immutable snapshot retains source=espn plus provider rows and provider identifiers. Any future
    production odds source must receive equivalent immutable retention before use.
  clv_script: docs/win/hockey/nhl/scripts/05_final_scores/04_nhl_clv.py
  outputs:
    summary: docs/win/hockey/nhl/05_final_scores/clv/NHL_clv.csv
    snapshot_history: docs/win/hockey/nhl/05_final_scores/clv/NHL_clv_snapshot_history.csv
  event_join:
    canonical_key: game_id
    provider_key: sportsbook_event_id
    mapping_source: docs/win/hockey/nhl/00_intake/sportsbook/NHL_*.csv
    rule: sportsbook_event_id remains provider-specific and is used only to locate the matching ESPN event inside immutable
      snapshots.
  closing_reference:
    rule: Use the latest eligible immutable ESPN snapshot strictly before the canonical NHL game start.
    live_exclusion: Reject snapshots at or after canonical game start and ignore event states in/post.
    provider_selection: Apply the same priority_fallback_per_market provider ordering used by transform_hockey_odds.py.
    priority:
    - Titanbets
    - MGM
    - Bet365
    - Caesars Sportsbook
    - SugarHouse
    - other non-live ESPN providers
    market_rule: Moneyline, puck line, and total closing references are selected independently by market.
  later_snapshot_analysis:
    window: selected_pulled_at < snapshot_at < canonical_game_start
    rule: Retain each later eligible pregame reference snapshot for the selected wager and mark the final eligible row as
      the closing reference.
  clv_metrics:
    selected_implied_probability: 1 / selected_decimal
    closing_implied_probability: 1 / closing_decimal
    clv_implied_probability: closing_implied_probability - selected_implied_probability; positive means the selected price
      beat the close.
    clv_decimal_ratio: selected_decimal / closing_decimal - 1; positive means the selected price beat the close.
    line_clv: Positive values represent favorable line movement for the selected side.
    line_change_rule: Price CLV is only calculated when the selected and reference lines are directly comparable. If the line
      changed, retain line_clv and leave price CLV blank.
  consensus_closing_market:
    status: NOT_USED
    reason: The current production odds architecture is priority/fallback per market rather than a consensus-market system.
  external_storage:
    status: UNRESOLVED
    rule: Do not remove current immutable snapshot retention if external storage is added later.
