# EDITABLE NHL prop filters. Ranges are INCLUSIVE; multiple ranges are OR.
# These are initial numeric selection rules, NOT backtested profitability thresholds.
# Missing prices bypass odds filters. Use 'best_prob', 'over', 'under', or 'both'.
# Probability is 0.00 to 1.00. Lines use actual sportsbook thresholds;
# goals_against uses the prediction threshold if no sportsbook line exists.

shots_on_goal:
  enabled: true
  pick_preference: best_prob
  over:
    enabled: true
    line: [[0.5, 5.5]]
    prob: [[0.55, 1.0]]
    odds: [[-300, -100], [100, 350]]
  under:
    enabled: true
    line: [[0.5, 5.5]]
    prob: [[0.55, 1.0]]
    odds: [[-300, -100], [100, 350]]

